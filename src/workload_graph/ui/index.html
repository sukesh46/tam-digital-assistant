<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workload graph</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: "Segoe UI", sans-serif; }
  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    background-image:
      radial-gradient(2px 2px at 4% 5%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 9% 16%, rgba(255,255,255,0.75), transparent),
      radial-gradient(1px 1px at 15% 8%, rgba(255,255,255,0.4), transparent),
      radial-gradient(2px 2px at 6% 94%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 13% 82%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 3% 70%, rgba(255,255,255,0.35), transparent),
      radial-gradient(2px 2px at 96% 6%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 89% 14%, rgba(255,255,255,0.65), transparent),
      radial-gradient(1px 1px at 83% 4%, rgba(255,255,255,0.35), transparent),
      radial-gradient(2px 2px at 95% 93%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 87% 84%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 97% 74%, rgba(255,255,255,0.35), transparent);
    background-repeat: no-repeat;
    opacity: 0.8;
  }
  body::after {
    background-image: radial-gradient(circle, #fff 1.1px, transparent 1.5px);
    background-size: 32px 16px;
    background-repeat: repeat;
    opacity: 0.85;
    -webkit-mask-image: radial-gradient(ellipse farthest-corner at 50% 50%, #000 0%, rgba(0,0,0,0.7) 28%, rgba(0,0,0,0.32) 52%, rgba(0,0,0,0.14) 74%, rgba(0,0,0,0.05) 100%);
    mask-image: radial-gradient(ellipse farthest-corner at 50% 50%, #000 0%, rgba(0,0,0,0.7) 28%, rgba(0,0,0,0.32) 52%, rgba(0,0,0,0.14) 74%, rgba(0,0,0,0.05) 100%);
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }
  main { position: relative; z-index: 1; min-height: 100%; padding: 48px 32px 64px; }
  h1 { font-weight: 500; letter-spacing: 0.08em; font-size: 22px; margin: 0 0 8px; }
  p.lead { margin: 0 0 28px; color: #d0d0d0; max-width: 40rem; }
  form { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; letter-spacing: 0.04em; }
  input {
    background: #000; color: #fff; border: 1px solid #fff; border-radius: 999px;
    padding: 10px 16px; font-size: 15px; min-width: 220px;
  }
  button {
    background: #fff; color: #000; border: 0; border-radius: 999px; padding: 11px 22px;
    font-size: 15px; cursor: pointer;
  }
  #loading { display: none; min-height: 60vh; place-items: center; text-align: center; }
  #loading.show { display: grid; }
  #loading strong { font-weight: 500; letter-spacing: 0.14em; font-size: 18px; }
  .pulse { width: 8px; height: 72px; margin: 18px auto 0; display: flex; flex-direction: column; justify-content: space-between; }
  .pulse i { width: 6px; height: 6px; border-radius: 50%; background: #fff; display: block; animation: blink 1.2s infinite; }
  .pulse i:nth-child(2) { animation-delay: 0.2s; }
  .pulse i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #error { color: #42A5F5; min-height: 1.4em; }
  #graphs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; margin-top: 28px; }
  @media (max-width: 1000px) { #graphs { grid-template-columns: 1fr; } }
  #accounts { display: flex; flex-direction: column; gap: 10px; }
  .account-row { display: flex; gap: 10px; align-items: center; }
  .account-row input { min-width: 240px; }
  .intake { display: flex; gap: 12px; align-items: center; }
  .count { font-size: 13px; color: #cfcfcf; letter-spacing: 0.04em; }
  button.ghost { background: transparent; color: #fff; border: 1px solid #fff; }
  button.ghost.on { background: #fff; color: #000; }
  button.round { width: 42px; height: 42px; padding: 0; font-size: 20px; line-height: 1; border-radius: 50%; }
  button:disabled { opacity: 0.35; cursor: default; }
  #log { list-style: none; padding: 0; margin: 20px auto 0; font-size: 13px; color: #cfcfcf; max-width: 60ch; }
  #log li { margin: 4px 0; }
  #review-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 28px; font-size: 14px; color: #d0d0d0; }
  #review-bar:empty { display: none; }
  #pager { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 28px 0 0; font-size: 13px; color: #d0d0d0; }
  #pager:empty { display: none; }
  article .actions { display: flex; gap: 10px; margin-top: 12px; }
  article .actions button { padding: 8px 18px; font-size: 14px; }
  article .state { color: #fff; }
  article { background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 16px; padding: 16px; }
  article h2 { margin: 0 0 4px; font-size: 18px; font-weight: 500; }
  article .meta { color: #cfcfcf; font-size: 13px; margin-bottom: 8px; }
  canvas { width: 100%; height: 420px; display: block; cursor: crosshair; }
  #tip {
    position: fixed; z-index: 5; display: none; max-width: 320px;
    background: #42A5F5; color: #04121f; border-radius: 10px; padding: 10px 12px;
    font-size: 13px; line-height: 1.45; pointer-events: none;
  }
  #tip b { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<main>
  <h1>WORKLOAD GRAPH</h1>
  <p class="lead">Add the member accounts to read, up to 20. One graph is drawn for each workload the run proposes. Approve or reject each one.</p>
  <form id="ask">
    <div id="accounts" aria-label="Accounts to read"></div>
    <div class="intake">
      <button type="button" class="ghost round" id="add" aria-label="Add an account">+</button>
      <span class="count" id="count"></span>
    </div>
    <label>Region<input name="region" value="ap-south-1" required></label>
    <button type="submit">Build</button>
  </form>
  <datalist id="past"></datalist>
  <p id="error"></p>
  <section id="loading" aria-live="polite">
    <div>
      <strong>READING THE ACCOUNTS</strong>
      <div class="pulse"><i></i><i></i><i></i></div>
      <ol id="log"></ol>
    </div>
  </section>
  <div id="review-bar"></div>
  <div id="graphs"></div>
  <nav id="pager"></nav>
</main>
<div id="tip"></div>
<script>
const form = document.getElementById("ask");
const loading = document.getElementById("loading");
const graphs = document.getElementById("graphs");
const error = document.getElementById("error");
const tip = document.getElementById("tip");
const accountsBox = document.getElementById("accounts");
const addButton = document.getElementById("add");
const countLabel = document.getElementById("count");
const pastList = document.getElementById("past");
const log = document.getElementById("log");
const reviewBar = document.getElementById("review-bar");
const pager = document.getElementById("pager");
const PAST_KEY = "wg.pastAccounts";
const MAX_ACCOUNTS = 20;
const PAGE_SIZE = 4;
let run = null;

function esc(value) {
  return String(value ?? "").replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
}
function tail(value) {
  const text = String(value && value.arn ? value.arn : value);
  const arn = text.includes("|") ? text.split("|").pop() : text;
  const parts = arn.split(":").filter(Boolean);
  return (parts[parts.length - 1] || arn).split("/").pop();
}
function showTip(html, x, y) {
  tip.innerHTML = html;
  tip.style.display = "block";
  const box = tip.getBoundingClientRect();
  tip.style.left = Math.min(x + 16, window.innerWidth - box.width - 12) + "px";
  tip.style.top = Math.min(y + 16, window.innerHeight - box.height - 12) + "px";
}
function hideTip() { tip.style.display = "none"; }

function draw(canvas, workload) {
  const ctx = canvas.getContext("2d");
  const members = workload.members || [];
  const ids = new Map();
  members.forEach((member) => ids.set(member.key.account_id + "|" + member.key.region + "|" + member.key.arn, member));
  const nodes = members.map((member) => ({
    id: member.key.account_id + "|" + member.key.region + "|" + member.key.arn,
    label: tail(member.key),
    member,
  }));
  const known = new Set(nodes.map((node) => node.id));
  (workload.edges || []).forEach((edge) => {
    if (!known.has(edge.dst)) {
      known.add(edge.dst);
      nodes.push({ id: edge.dst, label: tail(edge.dst), member: null });
    }
  });
  const index = new Map(nodes.map((node, i) => [node.id, i]));
  const links = [];
  (workload.edges || []).forEach((edge) => {
    const src = edge.src.account_id + "|" + edge.src.region + "|" + edge.src.arn;
    if (index.has(src) && index.has(edge.dst) && src !== edge.dst) {
      links.push({ a: index.get(src), b: index.get(edge.dst), edge });
    }
  });
  const n = nodes.length || 1;
  nodes.forEach((node, i) => {
    const angle = (Math.PI * 2 * i) / n;
    node.x = Math.cos(angle);
    node.y = Math.sin(angle);
  });
  for (let step = 0; step < 80; step += 1) {
    for (let i = 0; i < nodes.length; i += 1) {
      for (let j = i + 1; j < nodes.length; j += 1) {
        let dx = nodes[j].x - nodes[i].x;
        let dy = nodes[j].y - nodes[i].y;
        const dist = Math.hypot(dx, dy) || 0.01;
        const force = 0.02 / dist;
        dx = (dx / dist) * force;
        dy = (dy / dist) * force;
        nodes[i].x -= dx; nodes[i].y -= dy;
        nodes[j].x += dx; nodes[j].y += dy;
      }
    }
    links.forEach((link) => {
      const a = nodes[link.a];
      const b = nodes[link.b];
      a.x += (b.x - a.x) * 0.02;
      a.y += (b.y - a.y) * 0.02;
      b.x += (a.x - b.x) * 0.02;
      b.y += (a.y - b.y) * 0.02;
    });
  }
  const hits = [];
  const nodeRadius = 11;
  const labelGap = 14;

  function shelf(list, usable) {
    const ordered = [...list].sort((a, b) => a.node.x - b.node.x || a.node.label.localeCompare(b.node.label));
    const rows = [];
    ordered.forEach((item) => {
      const row = rows[rows.length - 1];
      const used = row ? row.reduce((sum, entry) => sum + entry.w + labelGap, -labelGap) : 0;
      if (!row || used + labelGap + item.w > usable) rows.push([item]);
      else row.push(item);
    });
    return rows;
  }

  function settle(rows, width) {
    const sidePad = 10;
    rows.forEach((row) => {
      let cursor = sidePad;
      row.forEach((entry) => {
        const ideal = entry.node.px - entry.w / 2;
        entry.x = Math.max(cursor, ideal);
        cursor = entry.x + entry.w + labelGap;
      });
      const overflow = cursor - labelGap - (width - sidePad);
      if (overflow > 0) row.forEach((entry) => { entry.x -= overflow; });
      if (row.length && row[0].x < sidePad) {
        let x = sidePad;
        row.forEach((entry) => {
          entry.x = x;
          x += entry.w + labelGap;
        });
      }
    });
  }

  function paint() {
    const width = canvas.clientWidth;
    if (width < 40) return;
    let fontSize = 12;
    ctx.font = fontSize + "px sans-serif";
    let widest = 1;
    nodes.forEach((node) => {
      widest = Math.max(widest, ctx.measureText(node.label).width);
    });
    while (widest > width - 24 && fontSize > 10) {
      fontSize -= 1;
      ctx.font = fontSize + "px sans-serif";
      widest = 1;
      nodes.forEach((node) => {
        widest = Math.max(widest, ctx.measureText(node.label).width);
      });
    }
    const labelH = fontSize + 3;
    const usable = Math.max(width - 20, 40);
    const measured = nodes.map((node) => ({
      node,
      w: Math.ceil(ctx.measureText(node.label).width),
    }));
    const midY = nodes.reduce((sum, node) => sum + node.y, 0) / (nodes.length || 1);
    const topRows = shelf(measured.filter((item) => item.node.y <= midY), usable);
    const bottomRows = shelf(measured.filter((item) => item.node.y > midY), usable);
    const rowStride = labelH + 6;
    const chrome = nodeRadius + 18;
    const marginTop = chrome + topRows.length * rowStride;
    const marginBottom = chrome + bottomRows.length * rowStride;
    const height = Math.max(420, marginTop + marginBottom + 200);
    canvas.style.height = height + "px";
    const boxHeight = canvas.clientHeight;
    canvas.width = width * devicePixelRatio;
    canvas.height = boxHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.clearRect(0, 0, width, boxHeight);
    ctx.font = fontSize + "px sans-serif";

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;
    nodes.forEach((node) => {
      minX = Math.min(minX, node.x);
      maxX = Math.max(maxX, node.x);
      minY = Math.min(minY, node.y);
      maxY = Math.max(maxY, node.y);
    });
    const spanX = Math.max(maxX - minX, 1);
    const spanY = Math.max(maxY - minY, 1);
    const innerW = Math.max(width - chrome * 2, 1);
    const innerH = Math.max(boxHeight - marginTop - marginBottom, 1);
    const fit = Math.min(innerW / spanX, innerH / spanY);
    const originX = (minX + maxX) / 2;
    const originY = (minY + maxY) / 2;
    nodes.forEach((node) => {
      node.px = chrome + innerW / 2 + (node.x - originX) * fit;
      node.py = marginTop + innerH / 2 + (node.y - originY) * fit;
    });
    settle(topRows, width);
    settle(bottomRows, width);
    topRows.forEach((row, index) => {
      const y = 6 + index * rowStride;
      row.forEach((entry) => {
        entry.node.labelBox = { x: entry.x, y, w: entry.w, h: labelH };
      });
    });
    bottomRows.forEach((row, index) => {
      const y = boxHeight - marginBottom + chrome + index * rowStride;
      row.forEach((entry) => {
        entry.node.labelBox = { x: entry.x, y, w: entry.w, h: labelH };
      });
    });

    hits.length = 0;
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 1.2;
    links.forEach((link) => {
      const a = nodes[link.a];
      const b = nodes[link.b];
      ctx.beginPath();
      ctx.moveTo(a.px, a.py);
      ctx.lineTo(b.px, b.py);
      ctx.stroke();
      hits.push({
        kind: "edge",
        x: (a.px + b.px) / 2,
        y: (a.py + b.py) / 2,
        r: 10,
        edge: link.edge,
      });
    });
    nodes.forEach((node) => {
      const gradient = ctx.createRadialGradient(node.px - 4, node.py - 4, 2, node.px, node.py, 14);
      gradient.addColorStop(0, "#fff");
      gradient.addColorStop(1, "#9a9a9a");
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(node.px, node.py, nodeRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(node.label, node.labelBox.x, node.labelBox.y);
      hits.push({ kind: "node", x: node.px, y: node.py, r: 14, node });
    });
  }
  paint();
  canvas.onmousemove = (event) => {
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    const hit = [...hits].reverse().find((item) => Math.hypot(item.x - x, item.y - y) <= item.r + 4);
    if (!hit) { hideTip(); return; }
    if (hit.kind === "node") {
      const member = hit.node.member;
      const lines = ["<b>" + esc(hit.node.label) + "</b>"];
      if (member) {
        lines.push(esc(member.membership) + (member.affinity == null ? "" : " · affinity " + member.affinity));
        lines.push(esc((member.reasons || []).join(", ") || "no extra reasons"));
      } else {
        lines.push("not placed in this workload");
      }
      lines.push(esc(hit.node.id));
      showTip(lines.join("<br>"), event.clientX, event.clientY);
    } else {
      const edge = hit.edge;
      const evidence = (edge.evidence || [])[0];
      const lines = ["<b>" + esc(edge.edge_type) + "</b>"];
      if (evidence) lines.push(esc(evidence.source) + " · " + esc(evidence.detail));
      showTip(lines.join("<br>"), event.clientX, event.clientY);
    }
  };
  canvas.onmouseleave = hideTip;
  window.addEventListener("resize", paint);
}

function pastAccounts() {
  try {
    const value = JSON.parse(localStorage.getItem(PAST_KEY) || "[]");
    return Array.isArray(value) ? value.filter((id) => /^[0-9]{12}$/.test(id)) : [];
  } catch (err) {
    return [];
  }
}
function rememberAccounts(ids) {
  const merged = [...ids, ...pastAccounts().filter((id) => !ids.includes(id))].slice(0, 50);
  localStorage.setItem(PAST_KEY, JSON.stringify(merged));
  refreshPastList();
}
function refreshPastList() {
  pastList.innerHTML = "";
  pastAccounts().forEach((id) => {
    const option = document.createElement("option");
    option.value = id;
    pastList.append(option);
  });
}
function updateCount() {
  const rows = accountsBox.querySelectorAll(".account-row");
  countLabel.textContent = rows.length + " of " + MAX_ACCOUNTS;
  addButton.disabled = rows.length >= MAX_ACCOUNTS;
  rows.forEach((row) => { row.querySelector("button").disabled = rows.length <= 1; });
}
function addRow(value) {
  if (accountsBox.querySelectorAll(".account-row").length >= MAX_ACCOUNTS) return;
  const row = document.createElement("div");
  row.className = "account-row";
  const input = document.createElement("input");
  input.name = "account";
  input.inputMode = "numeric";
  input.pattern = "[0-9]{12}";
  input.maxLength = 12;
  input.setAttribute("list", "past");
  input.setAttribute("aria-label", "Account id");
  input.placeholder = "12-digit account id";
  input.value = value || "";
  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "ghost round";
  remove.textContent = "−";
  remove.setAttribute("aria-label", "Remove this account");
  remove.onclick = () => { row.remove(); updateCount(); };
  row.append(input, remove);
  accountsBox.append(row);
  updateCount();
}
addButton.onclick = () => addRow("");
addRow("");
refreshPastList();

function showForm() {
  loading.classList.remove("show");
  form.style.display = "flex";
}
function resetRun() {
  run = null;
  log.innerHTML = "";
  graphs.innerHTML = "";
  reviewBar.innerHTML = "";
  pager.innerHTML = "";
  error.textContent = "";
}
function describe(event) {
  const id = event.account_id || "";
  switch (event.kind) {
    case "running": return "run started · " + event.detail;
    case "account_started": return "reading " + id;
    case "source_started": return "  " + id + " · reading " + event.detail + "…";
    case "source_done": return "  " + id + " · " + event.detail.replace(":", " → ");
    case "account_collected": return "read " + id + " · " + event.detail;
    case "account_failed": return id + " could not be read · " + event.detail;
    case "building": return "building the graph";
    case "awaiting_review": return "ready for review · " + event.detail;
    case "failed": return "the run failed · " + event.detail;
    default: return "";
  }
}
function showEvents(events) {
  events.forEach((event) => {
    run.lastSeq = event.seq;
    const text = describe(event);
    if (!text) return;
    const line = document.createElement("li");
    line.textContent = text;
    log.append(line);
  });
}
function stateLabel(decision) {
  if (decision === "approve") return "Approved";
  if (decision === "reject") return "Rejected";
  return "Pending review";
}
function makeCard(workload) {
  const card = document.createElement("article");
  const decision = run.decisions[workload.workload_id] || "";
  card.innerHTML = "<h2>" + esc(workload.name_hint) + "</h2><div class='meta'>"
    + esc(workload.confidence) + " · " + workload.members.length + " members · "
    + (workload.edges || []).length + " edges · <span class='state'>" + stateLabel(decision)
    + "</span></div><canvas></canvas><div class='actions'></div>";
  const actions = card.querySelector(".actions");
  [["approve", "Approve"], ["reject", "Reject"]].forEach(([name, label]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "ghost" + (decision === name ? " on" : "");
    button.textContent = label;
    button.onclick = () => decide(workload.workload_id, name);
    actions.append(button);
  });
  return card;
}
function renderBar() {
  const workloads = run.workloads;
  const count = (name) => workloads.filter((w) => run.decisions[w.workload_id] === name).length;
  const approved = count("approve");
  const rejected = count("reject");
  const pending = workloads.length - approved - rejected;
  reviewBar.innerHTML = "";
  const summary = document.createElement("span");
  summary.textContent = workloads.length + " workloads · " + approved + " approved · "
    + rejected + " rejected · " + pending + " pending";
  const again = document.createElement("button");
  again.type = "button";
  again.className = "ghost";
  again.textContent = "New run";
  again.onclick = () => { resetRun(); showForm(); };
  reviewBar.append(summary, again);
}
function renderPager(pages) {
  pager.innerHTML = "";
  if (pages <= 1) return;
  const previous = document.createElement("button");
  previous.type = "button";
  previous.className = "ghost";
  previous.textContent = "Previous";
  previous.disabled = run.page === 0;
  previous.onclick = () => { run.page -= 1; renderPage(); };
  const label = document.createElement("span");
  label.textContent = "Page " + (run.page + 1) + " of " + pages;
  const next = document.createElement("button");
  next.type = "button";
  next.className = "ghost";
  next.textContent = "Next";
  next.disabled = run.page >= pages - 1;
  next.onclick = () => { run.page += 1; renderPage(); };
  pager.append(previous, label, next);
}
function renderPage() {
  graphs.innerHTML = "";
  const workloads = run.workloads;
  const pages = Math.max(1, Math.ceil(workloads.length / PAGE_SIZE));
  run.page = Math.min(run.page, pages - 1);
  if (!workloads.length) {
    error.textContent = "No workload was proposed. Residuals and unmapped resources are in the build notes.";
  }
  workloads.slice(run.page * PAGE_SIZE, run.page * PAGE_SIZE + PAGE_SIZE).forEach((workload) => {
    const card = makeCard(workload);
    graphs.append(card);
    draw(card.querySelector("canvas"), workload);
  });
  renderBar();
  renderPager(pages);
}
async function decide(workloadId, decision) {
  const current = run;
  const response = await fetch("/api/jobs/" + current.jobId + "/review", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ workload_id: workloadId, decision }),
  });
  const body = await response.json();
  if (!response.ok) {
    error.textContent = body.error || "the decision was not recorded";
    return;
  }
  if (run !== current) return;
  current.decisions = body.decisions;
  renderPage();
}
async function follow(current) {
  while (run === current) {
    const response = await fetch("/api/jobs/" + current.jobId + "?after=" + current.lastSeq + "&wait=20");
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || "the run could not be followed");
    if (run !== current) return;
    showEvents(body.events);
    current.decisions = body.decisions;
    if (body.result && !current.resultShown) {
      current.resultShown = true;
      current.workloads = body.result.workloads || [];
    }
    if (body.settled) {
      if (body.state === "failed") {
        const failure = body.events.filter((event) => event.kind === "failed").pop();
        throw new Error("the run failed" + (failure ? " · " + failure.detail : ""));
      }
      loading.classList.remove("show");
      renderPage();
      return;
    }
  }
}

form.onsubmit = async (event) => {
  event.preventDefault();
  error.textContent = "";
  hideTip();
  const accounts = [...accountsBox.querySelectorAll("input")].map((input) => input.value.trim());
  if (accounts.some((id) => !/^[0-9]{12}$/.test(id))) {
    error.textContent = "Every account id must be exactly 12 digits.";
    return;
  }
  if (new Set(accounts).size !== accounts.length) {
    error.textContent = "An account is listed twice.";
    return;
  }
  const region = form.elements.region.value.trim();
  resetRun();
  form.style.display = "none";
  loading.classList.add("show");
  try {
    const response = await fetch("/api/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ accounts, region }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || "the run could not start");
    rememberAccounts(accounts);
    run = { jobId: body.job_id, lastSeq: 0, workloads: [], decisions: {}, page: 0, resultShown: false };
    await follow(run);
  } catch (err) {
    resetRun();
    error.textContent = err.message;
    showForm();
  }
};
</script>
