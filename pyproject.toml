[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workload-graph"
version = "0.0.0"
description = "Reconstructs candidate workloads from read-only AWS account snapshots."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.34,<2",
    "pydantic>=2.6,<3",
    "networkx>=3.2,<4",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]

[project.scripts]
workload-graph = "workload_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=workload_graph --cov-report=term-missing"
markers = [
    "determinism: determinism and invariant tests",
    "scenario: golden scenario tests",
    "slow: slow tests (large synthetic cases, subprocesses)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: tests use obviously fake credentials on purpose (see docs/DECISIONS.md D-17).
# S603: the determinism test runs the CLI in subprocesses with a fixed argument list.
# S311: seeded pseudo-random generators shuffle inputs and generate synthetic data.
"tests/**" = ["S101", "S105", "S106", "S311", "S603"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
